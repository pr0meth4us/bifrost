{% extends 'backoffice/base_auth.html' %}
{% set tenant_app = app %}

{% block title %}Verify Device{% endblock %}

{% block content %}
<form action="{{ url_for('auth_ui.verify_otp', client_id=app.client_id) }}" method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    <div class="form-control">
        <label class="label">6-Digit Code</label>
        <input type="text" name="otp" maxlength="6" required placeholder="000000" autofocus class="input text-center text-2xl tracking-[0.4em] font-black">
        <p class="text-xs text-muted mt-2 ml-1">We sent a verification code to your device</p>
    </div>
    
    <button type="submit" class="btn btn-primary w-full mt-2">Verify & Sign In</button>
</form>
{% endblock %}
