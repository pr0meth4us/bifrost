<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Password - {{ app.app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body class="flex items-center justify-center min-h-screen p-6">
<div class="w-full max-w-md">
  <div class="glass rounded-[2.5rem] shadow-2xl p-8 sm:p-12">
    <div class="text-center mb-10">
      <div class="h-16 w-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-6">🔑</div>
      <h1 class="text-3xl font-extrabold text-slate-900">New Password</h1>
      <p class="text-slate-500 mt-2">Create a secure password for your account.</p>
    </div>

    <form action="{{ url_for('auth_ui.reset_password', proof_token=proof_token, client_id=app.client_id) }}" method="POST" class="space-y-5">
    <input type=\"hidden\" name=\"csrf_token\" value=\"{{ csrf_token() }}\"/>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">New Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" minlength="8" required placeholder="Minimum 8 characters" autofocus
                 class="w-full pl-6 pr-12 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-600 outline-none transition-all">
          <button type="button" onclick="togglePasswordVisibility('password')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-indigo-600 transition-colors">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-200 transition-all transform active:scale-95">
        Set Password
      </button>
      <script>
          function togglePasswordVisibility(id) {
              const input = document.getElementById(id);
              const btn = input.nextElementSibling;
              if (input.type === "password") {
                  input.type = "text";
                  btn.innerHTML = `<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.268m5.842-.889A6 6 0 0118 12a5.964 5.964 0 01-.765 2.901m0 0a3 3 0 11-4.243-4.243m4.242 4.242L9.88 9.88" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
                  </svg>`;
              } else {
                  input.type = "password";
                  btn.innerHTML = `<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>`;
              }
          }
      </script>
    </form>
  </div>
</div>
</body>
</html>
