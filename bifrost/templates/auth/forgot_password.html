{% extends 'backoffice/base_auth.html' %}
{% set tenant_app = app %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<form action="{{ url_for('auth_ui.forgot_password', client_id=app.client_id) }}" method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    <div class="form-control">
        <label class="label">Email Address</label>
        <input type="email" name="email" required placeholder="name@example.com" class="input" autofocus>
    </div>
    
    <button type="submit" class="btn btn-primary w-full mt-2">Send Reset Code</button>
</form>
{% endblock %}

{% block below_card %}
<div class="mt-6 text-center text-sm">
    <a href="{{ url_for('auth_ui.login', client_id=app.client_id) }}" class="text-muted hover:text-ink font-semibold flex items-center justify-center gap-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        Back to Login
    </a>
</div>
{% endblock %}
