{% extends 'backoffice/base_auth.html' %}
{% set tenant_app = app %}

{% block title %}Create Account{% endblock %}

{% block content %}
<form action="{{ url_for('auth_ui.register', client_id=app.client_id) }}" method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    <div class="form-control">
        <label class="label">Display Name</label>
        <input type="text" name="display_name" required placeholder="John Doe" class="input" autofocus>
    </div>
    
    <div class="form-control">
        <label class="label">Email Address</label>
        <input type="email" name="email" required placeholder="name@example.com" class="input">
    </div>
    
    <div class="form-control">
        <label class="label mb-1">Password</label>
        <div class="relative">
            <input type="password" id="password" name="password" required placeholder="Minimum 8 characters" class="input pr-10">
            <button type="button" onclick="togglePasswordVisibility('password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-ink">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </button>
        </div>
    </div>
    
    <button type="submit" class="btn btn-primary w-full mt-2">Create Account</button>
</form>
{% endblock %}

{% block below_card %}
<div class="mt-6 text-center text-sm">
    <span class="muted">Already have an account?</span> <a href="{{ url_for('auth_ui.login', client_id=app.client_id) }}" class="text-accent hover:underline font-semibold">Sign in instead</a>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePasswordVisibility(id) {
    const input = document.getElementById(id);
    const btn = input.nextElementSibling;
    if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.268m5.842-.889A6 6 0 0118 12a5.964 5.964 0 01-.765 2.901m0 0a3 3 0 11-4.243-4.243m4.242 4.242L9.88 9.88" /><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" /></svg>`;
    } else {
        input.type = "password";
        btn.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
    }
}
</script>
{% endblock %}
