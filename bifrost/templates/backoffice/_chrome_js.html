{# The only two behaviours the shell itself needs. Shared by base.html and
   base_auth.html — the theme toggle exists on the sign-in screen too, so a
   dark-mode user never gets flashbanged on the way in. #}
<script>
function toggleTheme() {
  var el = document.documentElement;
  var next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  el.setAttribute('data-theme', next);
  try { localStorage.setItem('valhalla-theme', next); } catch (e) {}
}

// Any form submit that leaves the page marks its button busy. The console
// talks to a tenant database over the network on nearly every action, so a
// second or two of nothing is normal — and indistinguishable from a dead
// button. Also stops the double-submit that used to send two OTPs.
document.addEventListener('submit', function (e) {
  var form = e.target;
  if (!(form instanceof HTMLFormElement) || form.hasAttribute('data-no-busy')) return;
  var btn = form.querySelector('button[type=submit], button:not([type])');
  if (!btn || btn.dataset.busy === 'true') return;
  // The clicked button's name/value is submitted for us; disabling it outright
  // would drop it, so it goes inert but stays enabled until after submission.
  btn.dataset.busy = 'true';
  btn.setAttribute('aria-busy', 'true');
  btn.insertAdjacentHTML('afterbegin', '<span class="spinner" aria-hidden="true"></span>');
  setTimeout(function () { btn.disabled = true; }, 0);
});

function toggleSidebar(btn) {
  var nav = document.querySelector('.sidebar');
  if (!nav) return;
  var open = nav.getAttribute('data-open') !== 'true';
  nav.setAttribute('data-open', open);
  btn.setAttribute('aria-expanded', open);
}
</script>
