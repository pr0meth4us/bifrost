{% extends "backoffice/base_auth.html" %}
{% block title %}Reset your password{% endblock %}

{% block content %}
<h2 class="text-base font-semibold mb-1">Reset your password</h2>
<p class="muted text-[13px] mb-5">We'll email you a code to set a new one.</p>

<form method="POST" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

  <div>
    <label class="label" for="email">Email</label>
    <input class="input" id="email" name="email" type="email" required autofocus
           autocomplete="username">
  </div>

  <button type="submit" class="btn btn-primary w-full">Send reset code</button>
</form>
{% endblock %}

{% block below_card %}
<p class="text-center mt-4">
  <a class="text-[13px] muted hover:text-fg" href="{{ url_for('backoffice.login') }}">Back to sign in</a>
</p>
{% endblock %}
