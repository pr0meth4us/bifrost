{% extends "backoffice/base.html" %}

{% block title %}Live monitor{% endblock %}

{% block head %}
<style>
  .log-line {
    display: flex; gap: 10px;
    padding: 3px 0;
    font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
    border-bottom: 1px solid rgb(var(--c-border) / .5);
  }
  .log-line:hover { background: rgb(var(--c-surface-2) / .6); }
  .log-time { color: rgb(var(--c-fg-subtle)); white-space: nowrap; }
  .log-app  { color: rgb(var(--c-accent)); font-weight: 600; white-space: nowrap; }
  .log-level { font-weight: 700; white-space: nowrap; }
  .log-level-INFO     { color: rgb(var(--c-fg-muted)); }
  .log-level-WARNING  { color: rgb(var(--c-warning)); }
  .log-level-ERROR,
  .log-level-CRITICAL { color: rgb(var(--c-danger)); }
  .log-message { color: rgb(var(--c-fg)); word-break: break-word; }
</style>
{% endblock %}

{% block topbar_actions %}
  <span class="badge" id="log-counter-badge"><span id="log-counter">0</span> events</span>
  <button type="button" class="btn btn-sm" id="pause" aria-pressed="false"
          onclick="togglePause()">Pause</button>
{% endblock %}

{% block content %}
<div class="main-pad flex-1 min-h-0 flex flex-col">
  <div class="card flex-1 min-h-0 flex flex-col">
    <div class="card-head flex items-center justify-between">
      <span>Ecosystem event stream</span>
      <span class="badge" id="status">Connecting…</span>
    </div>
    <div id="terminal" class="flex-1 min-h-0 overflow-y-auto px-4 py-3"
         role="log" aria-live="polite" aria-label="Live event stream">
      <p class="muted">Waiting for events…</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const terminal = document.getElementById('terminal');
const counterEl = document.getElementById('log-counter');
const statusEl = document.getElementById('status');
const pauseBtn = document.getElementById('pause');

const seen = new Set();
let total = 0;
let paused = false;

function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  pauseBtn.setAttribute('aria-pressed', paused);
}

function formatTime(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toTimeString().slice(0, 8) + '.' +
         String(d.getMilliseconds()).padStart(3, '0');
}

function span(className, text) {
  const n = document.createElement('span');
  n.className = className;
  n.textContent = text;          // never innerHTML — see below
  return n;
}

// Log messages are attacker-influenced: they carry email addresses, filenames
// and exception text from tenant applications. The previous version escaped
// only < and > and then re-inserted markup for keyword highlighting, which put
// it one regex change away from stored XSS in an admin's browser. textContent
// removes the class of bug outright; the decorative colour-coding it cost was
// never worth that.
function appendLog(log) {
  const signature = log.timestamp + '|' + log.client_id + '|' + log.message;
  if (seen.has(signature)) return false;
  seen.add(signature);
  if (seen.size > 2000) seen.delete(seen.values().next().value);

  if (total === 0) terminal.replaceChildren();
  total++;
  counterEl.textContent = total;

  const level = log.level || 'INFO';
  const line = document.createElement('div');
  line.className = 'log-line';
  line.append(
    span('log-time', formatTime(log.timestamp)),
    span('log-app', log.app_name || 'unknown'),
    span('log-level log-level-' + level, level),
    span('log-message', log.message || '')
  );
  terminal.append(line);

  // Cap the DOM as well as the dedupe set — this page is left open for hours.
  while (terminal.childElementCount > 1000) terminal.firstElementChild.remove();
  return true;
}

async function fetchLogs() {
  if (paused) return;
  try {
    const res = await fetch("{{ url_for('backoffice.monitor_stream') }}");
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    statusEl.textContent = 'Live';
    statusEl.className = 'badge badge-success';

    if (data.logs?.length) {
      // The endpoint returns newest-first; append oldest-first so the stream
      // reads top to bottom.
      let added = false;
      data.logs.slice().reverse().forEach(l => { if (appendLog(l)) added = true; });

      // Only follow the tail if the reader is already at the bottom — yanking
      // the viewport while someone is reading scrollback is infuriating.
      if (added) {
        const atBottom = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 80;
        if (atBottom) terminal.scrollTop = terminal.scrollHeight;
      }
    }
  } catch (e) {
    statusEl.textContent = 'Disconnected';
    statusEl.className = 'badge badge-danger';
  }
}

setInterval(fetchLogs, 1500);
fetchLogs();
</script>
{% endblock %}
