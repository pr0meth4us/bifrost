{% extends "base.html" %}

{% block content %}
<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Heimdall Monitor</h1>
            <p class="text-slate-500 font-medium">Live Ecosystem Logs (Redis Stream)</p>
        </div>
        <div>
            <a href="{{ url_for('backoffice.dashboard') }}" class="px-4 py-2 bg-slate-200 text-slate-700 font-semibold rounded-lg hover:bg-slate-300 transition-colors">
                Back to Dashboard
            </a>
        </div>
    </div>

    <!-- The Terminal Window -->
    <div class="w-full bg-black rounded-xl shadow-2xl border border-slate-800 overflow-hidden" style="height: 70vh;">
        <div class="bg-slate-900 px-4 py-2 flex items-center gap-2 border-b border-slate-800">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
            <span class="ml-4 text-xs font-mono text-slate-500">root@bifrost:~# tail -f /var/log/ecosystem.log</span>
        </div>
        
        <div id="terminal-output" class="p-4 h-full overflow-y-auto font-mono text-sm leading-relaxed" style="color: #00ff00; background-color: #050505; padding-bottom: 60px;">
            <div class="text-slate-500 mb-4">Initializing connection to Redis stream...</div>
        </div>
    </div>
</div>

<style>
    /* Custom Scrollbar for Terminal */
    #terminal-output::-webkit-scrollbar {
        width: 8px;
    }
    #terminal-output::-webkit-scrollbar-track {
        background: #111;
    }
    #terminal-output::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
    }
    #terminal-output::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
    .log-line {
        margin-bottom: 4px;
        word-break: break-all;
    }
    .log-time { color: #666; }
    .log-app { color: #00ffff; font-weight: bold; }
    .log-level-INFO { color: #00ff00; }
    .log-level-WARNING { color: #ffff00; }
    .log-level-ERROR { color: #ff0000; font-weight: bold; }
    .log-level-CRITICAL { color: #ff00ff; font-weight: bold; background-color: #330000; }
</style>

<script>
    const terminal = document.getElementById('terminal-output');
    let knownLogSignatures = new Set();
    
    function formatTime(isoString) {
        try {
            const d = new Date(isoString);
            return d.toISOString().split('T')[1].replace('Z', '');
        } catch(e) {
            return isoString;
        }
    }

    function appendLog(log) {
        // Create a unique signature to avoid duplicates
        const sig = `${log.timestamp}-${log.client_id}-${log.message}`;
        if (knownLogSignatures.has(sig)) return false;
        knownLogSignatures.add(sig);
        
        // Keep set size manageable
        if (knownLogSignatures.size > 2000) {
            const it = knownLogSignatures.values();
            knownLogSignatures.delete(it.next().value);
        }

        const div = document.createElement('div');
        div.className = 'log-line';
        
        const timeSpan = document.createElement('span');
        timeSpan.className = 'log-time';
        timeSpan.textContent = `[${formatTime(log.timestamp)}] `;
        
        const appSpan = document.createElement('span');
        appSpan.className = 'log-app';
        appSpan.textContent = `<${log.app_name}> `;
        
        const levelSpan = document.createElement('span');
        levelSpan.className = `log-level-${log.level}`;
        levelSpan.textContent = `[${log.level}] `;
        
        const msgSpan = document.createElement('span');
        msgSpan.className = 'log-message';
        // Basic escaping
        const safeMsg = log.message.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        msgSpan.innerHTML = safeMsg;

        div.appendChild(timeSpan);
        div.appendChild(appSpan);
        div.appendChild(levelSpan);
        div.appendChild(msgSpan);
        
        terminal.appendChild(div);
        return true;
    }

    async function fetchLogs() {
        try {
            const res = await fetch("{{ url_for('backoffice.monitor_stream') }}");
            if (!res.ok) throw new Error('Stream failed');
            const data = await res.json();
            
            if (data.logs && data.logs.length > 0) {
                // Logs come from LRANGE 0 100, so [0] is the newest.
                // We want to process them oldest to newest to append correctly.
                const orderedLogs = data.logs.reverse();
                
                let addedAny = false;
                orderedLogs.forEach(log => {
                    if (appendLog(log)) addedAny = true;
                });
                
                if (addedAny) {
                    // Auto-scroll to bottom
                    terminal.scrollTop = terminal.scrollHeight;
                }
            }
        } catch(e) {
            console.error("Monitor polling error:", e);
        }
    }

    // Poll every 1.5 seconds
    setInterval(fetchLogs, 1500);
    // Initial fetch
    fetchLogs();
</script>
{% endblock %}
