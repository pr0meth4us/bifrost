{% extends "backoffice/base_auth.html" %}
{% block title %}Set a new password{% endblock %}

{% block content %}
<h2 class="text-base font-semibold mb-1">Set a new password</h2>
<p class="muted text-[13px] mb-5">
  Enter the code we emailed to <span class="font-semibold text-fg">{{ email }}</span>.
</p>

<form method="POST" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

  <div>
    <label class="label" for="otp">Reset code</label>
    <input class="input mono text-center text-xl tracking-[0.4em]" id="otp" name="otp"
           type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           autocomplete="one-time-code" autofocus required placeholder="123456">
  </div>

  <div>
    <label class="label" for="password">New password</label>
    <div class="relative">
      <input class="input pr-16" id="password" name="password" type="password" required
             autocomplete="new-password">
      <button type="button" class="btn btn-ghost btn-sm absolute right-1 top-1/2 -translate-y-1/2"
              aria-pressed="false" aria-controls="password"
              onclick="togglePassword(this, 'password')">Show</button>
    </div>
  </div>

  <button type="submit" class="btn btn-primary w-full">Update password</button>
</form>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(btn, id) {
  var input = document.getElementById(id);
  var reveal = input.type === 'password';
  input.type = reveal ? 'text' : 'password';
  btn.textContent = reveal ? 'Hide' : 'Show';
  btn.setAttribute('aria-pressed', reveal);
}
</script>
{% endblock %}
